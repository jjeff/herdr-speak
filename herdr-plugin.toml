id = "herdr-speak"
name = "Herdr Speak"
version = "0.2.0"
# Oldest version tested. Needs `--machine` API forwarding and `agent read --source recent-unwrapped`.
min_herdr_version = "0.9.3"
description = "Hear a short spoken recap when a coding agent finishes a turn, on Local and on saved SSH machines"
platforms = ["macos", "linux", "windows"]

# Every command goes through herdr-speak.cmd, which is both a shell script and a
# Windows batch file, because Windows' python3 is often a Store placeholder.

# The Speaker runs in the background, started with Herdr. It holds a lock, so
# reruns (server handoff, the start action) never start a second copy.
[[startup]]
command = ["./herdr-speak.cmd", "--background"]

# Restart it, for example after editing config.json or updating the plugin.
[[actions]]
id = "start"
title = "Restart speaker"
contexts = ["workspace"]
command = ["./herdr-speak.cmd", "--restart", "--background"]

# Local agents: poll right away instead of waiting for the next tick. Remote
# agents' events fire on their own servers, so the Speaker still polls those.
[[events]]
on = "pane.agent_status_changed"
command = ["./herdr-speak.cmd", "--poke"]

[[actions]]
id = "mute"
title = "Mute or unmute speaker"
contexts = ["workspace"]
command = ["./herdr-speak.cmd", "--mute"]

[[actions]]
id = "skip"
title = "Skip the current recap"
contexts = ["workspace"]
command = ["./herdr-speak.cmd", "--skip"]

# Watch what the Speaker hears and says.
[[panes]]
id = "log"
title = "Speaker log"
placement = "split"
command = ["./herdr-speak.cmd", "--tail"]

[[actions]]
id = "log"
title = "Show speaker log"
contexts = ["workspace"]
command = ["./herdr-speak.cmd", "--open-log"]
