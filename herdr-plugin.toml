id = "herdr-speak"
name = "Herdr Speak"
version = "0.1.0"
# Oldest version tested. Needs `--machine` API forwarding and `agent read --source recent-unwrapped`.
min_herdr_version = "0.9.3"
description = "Hear a short spoken recap when a coding agent finishes a turn, on Local and on saved SSH machines"
platforms = ["macos"]

# Long-running listener. Open it while LOCAL is selected so it runs on your Mac.
[[panes]]
id = "speaker"
title = "Speaker"
placement = "split"
command = ["python3", "speaker.py"]

[[actions]]
id = "start"
title = "Start speaker"
contexts = ["workspace"]
command = ["sh", "-c", "\"$HERDR_BIN_PATH\" plugin pane open --plugin \"$HERDR_PLUGIN_ID\" --entrypoint speaker --placement split --no-focus"]
