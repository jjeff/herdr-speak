id = "herder-speak"
name = "Herder Speak"
version = "0.1.0"
# Guess: needs a Herdr with `--machine` API forwarding. Adjust if link refuses.
min_herdr_version = "0.9.0"
description = "Speak Claude Code's 🔊 recap lines aloud on this machine, across Local and saved SSH machines"
platforms = ["macos"]

# Long-running listener. Open it while LOCAL is selected so it runs on your laptop.
[[panes]]
id = "speaker"
title = "Speaker"
placement = "split"
command = ["python3", "speaker.py"]

[[actions]]
id = "start"
title = "Start speaker"
contexts = ["workspace"]
command = ["sh", "-c", "\"$HERDR_BIN_PATH\" plugin pane open --plugin herder-speak --entrypoint speaker --placement split --no-focus"]
